<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#06101f"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Hockey Freunde Manager</title>
<style>:root{--gold:#ffd84d;--ice:#9fe3ff;--muted:#c3d0e2;--txt:#f6f9ff;--rim:rgba(255,255,255,.2);--blur:blur(28px) saturate(190%)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#06101f}
body{margin:0;color:var(--txt);font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;min-height:100vh;background:transparent;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;background:radial-gradient(38% 30% at 18% 12%,#2a7fd4cc,transparent 70%),radial-gradient(30% 26% at 88% 22%,#ffcf3a70,transparent 70%),radial-gradient(36% 32% at 70% 78%,#7a4dff88,transparent 70%),radial-gradient(34% 30% at 10% 82%,#19c7d6aa,transparent 70%),linear-gradient(160deg,#071a33,#0b1630 50%,#050b18);filter:blur(10px)}
header{padding:calc(18px + env(safe-area-inset-top)) 20px 8px;max-width:900px;margin:auto;display:flex;align-items:baseline;justify-content:space-between}
.brand{font-weight:800;font-size:17px;letter-spacing:.02em}
.ver{font-size:11px;color:var(--ice);opacity:.8;padding:3px 8px;border-radius:999px;border:1px solid rgba(159,227,255,.35)}
main{max-width:900px;margin:auto;padding:8px 14px calc(110px + env(safe-area-inset-bottom))}
.glass,nav,.sheet{position:relative;-webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur);border:1px solid var(--rim)}
.glass{border-radius:28px;padding:20px;margin-bottom:14px;background:linear-gradient(140deg,rgba(255,255,255,.13),rgba(255,255,255,.03) 45%,rgba(255,255,255,.06));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 1px 0 0 rgba(255,255,255,.1),0 20px 50px -18px rgba(0,0,0,.55)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(120% 60% at 0% 0%,rgba(255,255,255,.2),transparent 45%)}
.glass>*{position:relative}
h1{font-size:34px;line-height:1.05;margin:2px 0 16px;letter-spacing:-.02em}
h2{font-size:17px;margin:0}
.muted,.small{color:var(--muted)}.small{font-size:13px}
.kicker{color:var(--ice);font-size:13px;font-weight:600;margin:0}
.gold{color:var(--gold);font-weight:800}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;font-weight:600;border:1px solid var(--rim);border-radius:999px;padding:11px 18px;min-height:44px;background:linear-gradient(180deg,rgba(255,255,255,.17),rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.4);transition:transform .12s,background .2s}
button:active{transform:scale(.96);background:rgba(255,255,255,.22)}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
button.primary{color:#1d1600;border-color:rgba(255,236,150,.7);background:linear-gradient(180deg,#ffe56e,#f0be16);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 10px 26px -10px #ffcf3aaa}
button.sm{min-height:36px;padding:7px 14px;font-size:13px}
button.icon{width:40px;height:40px;min-height:40px;padding:0;display:grid;place-items:center;flex:none}
button.danger{color:#ffb3b3;border-color:rgba(255,140,140,.4)}
button.add{width:100%;border-style:dashed;background:rgba(255,255,255,.04);box-shadow:none;margin-top:2px}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.stats div{padding:12px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.28)}
.stats b{display:block;font-size:26px;line-height:1.1;color:var(--gold)}
.stats span{font-size:12px;color:var(--muted)}
.plan{margin:0 0 16px;color:var(--muted)}
.toolbar{position:sticky;top:calc(8px + env(safe-area-inset-top));z-index:2;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 10px 16px;border-radius:999px;background:rgba(16,28,50,.45)}
.toolbar b{color:var(--gold);font-size:18px}
.list{padding:16px 14px 8px}.list>.row{padding:0 6px 6px}
.player{display:flex;gap:10px;align-items:center;padding:8px 6px;border-top:1px solid rgba(255,255,255,.08);transition:opacity .2s}
.player.off{opacity:.5}
.tap{display:flex;gap:12px;align-items:center;flex:1;min-width:0;cursor:pointer;min-height:44px}
.tap b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tap .small{display:block;font-size:12px}
.skill{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:50%;font-weight:800;font-size:14px;color:var(--gold);background:rgba(255,216,77,.1);border:1px solid rgba(255,216,77,.3)}
.skill.none{color:var(--muted);background:none;border-color:rgba(255,255,255,.15)}
input[type=checkbox]{-webkit-appearance:none;appearance:none;width:48px;height:30px;margin:0;flex:none;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid var(--rim);position:relative;cursor:pointer;transition:background .2s}
input[type=checkbox]::after{content:"";position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:50%;background:linear-gradient(180deg,#fff,#dfe8f5);box-shadow:0 2px 6px rgba(0,0,0,.35);transition:transform .22s cubic-bezier(.3,1.4,.5,1)}
input[type=checkbox]:checked{background:rgba(110,210,255,.6);border-color:rgba(159,227,255,.85)}
input[type=checkbox]:checked::after{transform:translateX(18px)}
.line{padding:12px;border-radius:20px;margin-top:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.25)}
.line .head{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px;font-weight:700}
.line .head span{font-size:12px;font-weight:500;color:var(--muted)}
.line.rot{border-style:dashed;background:rgba(159,227,255,.05)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.slots.two{grid-template-columns:repeat(2,1fr)}
.slot{display:flex;justify-content:space-between;align-items:center;gap:4px;padding:9px 10px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.04));border:1px solid rgba(255,255,255,.16);font-size:14px;font-weight:600;min-width:0}
.slot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot em{font-style:normal;font-size:12px;color:var(--gold);flex:none}
.empty{text-align:center;padding:32px 20px}
.field{margin-top:14px}.field label{display:block;color:var(--muted);font-size:13px;margin:0 0 6px 4px}
input[type=text],input[type=number],select{width:100%;padding:12px 14px;border-radius:16px;border:1px solid var(--rim);background:rgba(255,255,255,.08);-webkit-appearance:none;appearance:none;min-height:46px}
select{background-image:linear-gradient(45deg,transparent 50%,#c3d0e2 50%),linear-gradient(135deg,#c3d0e2 50%,transparent 50%);background-position:calc(100% - 20px) 52%,calc(100% - 15px) 52%;background-size:5px 5px;background-repeat:no-repeat;padding-right:36px}
select option{color:#0b1630}
.item{display:flex;gap:10px;align-items:center;padding:12px 2px;border-top:1px solid rgba(255,255,255,.08)}
nav{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:12px;right:12px;max-width:460px;margin:auto;z-index:3;display:flex;padding:6px;border-radius:999px;background:rgba(16,28,50,.5);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 18px 40px -12px rgba(0,0,0,.6)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;box-shadow:none;font-size:11px;font-weight:600;color:#c6d2e3;padding:7px 4px;min-height:52px}
nav button.active{color:#fff;background:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,.07));box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
nav button.active svg{stroke:var(--gold)}
.sheet-bg{position:fixed;inset:0;z-index:10;display:flex;align-items:flex-end;background:rgba(3,8,18,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.sheet{width:100%;max-width:520px;margin:0 auto calc(10px + env(safe-area-inset-bottom));padding:22px 20px 18px;border-radius:30px;background:linear-gradient(160deg,rgba(40,58,92,.72),rgba(18,28,50,.82));box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 -10px 60px rgba(0,0,0,.5);animation:up .28s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:rgba(255,255,255,.3);margin:-10px auto 14px}
.sheet .actions{display:flex;gap:8px;margin-top:20px}.sheet .actions .primary{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.hidden{display:none!important}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass,nav,.sheet{background:rgba(20,32,54,.92)}}
</style></head><body><header><div class="brand">Hockey Freunde</div><span class="ver">v1.3</span></header><main id="app"></main><nav><button data-tab="home"><svg class="i" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</button><button data-tab="players"><svg class="i" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c2 .6 3.2 2.3 3.5 5.2"/></svg>Players</button><button data-tab="builder"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="4" rx="2"/><rect x="3" y="10" width="18" height="4" rx="2"/><rect x="3" y="16" width="12" height="4" rx="2"/></svg>Lines</button><button data-tab="history"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>History</button></nav>
<script>
const roster=[
["Aaron",9,"D","RW/LW"],["Andre",4,"D","RW/LW"],["Denis",4,"RW/LW",""],["Flo B",7,"RW/LW",""],["Jonas",7,"RW/LW","Center"],["Dominik",7,"LW/RW","D"],["Raphi",7,"RW","Center"],["Flo F",6,"RW/LW","Center"],["Karl",6,"D","D"],["Hias",null,"D",""],["Johannes",7,"Center","RW/LW"],["Maxi",7,"RW/LW","RW/LW"],["Bene",null,"Goalie","Goalie"],["Martina",null,"Goalie","Goalie"],["Carlo",7,"Forward","D"],["Lucas",6,"D","RW/LW"],["Leo",9,"Forward","Center/Defense"],["Mario",6,"RW/LW","Center"],["Michi P",6,"Forward",""],["Florens",7,"D",""],["Luca",9,"D","Forward"],["Guggi",5,"D","RW/LW"],["Morty",3,"Forward",""],["Tim",null,"D","RW/LW"],["Max",7,"D","RW/LW"],["Volker",8,"D","Center"],["Luis",4,"Center","RW/LW"],["Michi W",10,"Forward","RW/LW"],["Oli",8,"Center","RW/LW"],["Femke",4,"Forward",""],["Mischa",null,"Forward",""],["Gilbert",9,"Forward",""]
].map((x,i)=>({id:"p"+i,name:x[0],skill:x[1],pos:x[2],alt:x[3],attending:true}));
const KEY="hfm-v1";let data;try{data=JSON.parse(localStorage.getItem(KEY))||{players:roster,chem:[],games:[]}}catch{data={players:roster,chem:[],games:[]}}let tab="home",lineup=null,strategy="balanced";
const save=()=>localStorage.setItem(KEY,JSON.stringify(data)),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),rating=p=>p.skill||5,goalie=p=>p.pos==="Goalie",isD=p=>p.pos==="D";
function nav(t){tab=t;render()}document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>nav(b.dataset.tab));
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));let root=document.getElementById("app");
if(tab==="home"){let att=data.players.filter(p=>p.attending),f=att.filter(p=>!isD(p)&&!goalie(p)).length,d=att.filter(isD).length,g=att.filter(goalie).length,ln=f>=3?Math.floor(f/3):(f?1:0),rot=f>=3?f%3:0,pr=Math.ceil(d/2);root.innerHTML=`<section class="glass"><p class="kicker">Game day</p><h1>${att.length} ${att.length===1?"player":"players"} in</h1><div class="stats"><div><b>${f}</b><span>Forwards</span></div><div><b>${d}</b><span>Defense</span></div><div><b>${g}</b><span>Goalies</span></div></div><p class="plan">${f&&d?`That's ${ln} forward ${ln===1?"line":"lines"} of three${rot?`, ${rot} rotating`:""} and ${pr} defense ${pr===1?"pair":"pairs"}.`:"Turn on who's playing to see how many lines you'll have."}</p><div class="row"><button class="primary" onclick="nav('players')">Set attendance</button><button onclick="nav('builder')">Build lineup</button></div></section><section class="glass"><h2 style="margin-bottom:6px">Recent games</h2>${data.games.slice(-3).reverse().map(g=>`<div class="item"><b class="grow">${esc(g.opponent)}</b><span class="muted">${esc(g.result||"No score")}</span></div>`).join("")||'<p class="muted" style="margin:6px 0 0">Saved games show up here.</p>'}</section>`}
if(tab==="players"){let n=data.players.filter(p=>p.attending).length,grp=[["Forwards",p=>!isD(p)&&!goalie(p)],["Defense",isD],["Goalies",goalie]];root.innerHTML=`<div class="toolbar glass"><span style="white-space:nowrap"><b>${n}</b> <span class="muted">of ${data.players.length} in</span></span><div class="row" style="flex-wrap:nowrap;gap:6px"><button class="sm" onclick="setAll(true)">Select all</button><button class="sm" onclick="setAll(false)">Clear all</button></div></div>`+grp.map(([t,fn])=>{let ps=data.players.filter(fn);return ps.length?`<section class="glass list"><div class="row between"><h2>${t}</h2><span class="small">${ps.filter(p=>p.attending).length} of ${ps.length}</span></div>${ps.map(p=>`<div class="player${p.attending?"":" off"}"><label class="tap"><input type="checkbox" ${p.attending?"checked":""} onchange="attend('${p.id}',this.checked)" aria-label="${esc(p.name)} playing"><span class="grow"><b>${esc(p.name)}</b><span class="small">${esc(p.pos)}${p.alt&&p.alt!==p.pos?" · also "+esc(p.alt):""}</span></span></label><span class="skill${p.skill==null?" none":""}" title="Skill">${p.skill??"–"}</span><button class="icon" aria-label="Edit ${esc(p.name)}" onclick="editPlayer('${p.id}')"><svg class="i" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></svg></button></div>`).join("")}</section>`:""}).join("")+`<button class="add" onclick="addPlayer()">Add player</button>`}
if(tab==="builder"){const tot=g=>g.reduce((s,p)=>s+rating(p),0),slots=(g,c)=>`<div class="slots${c?" "+c:""}">${g.map(p=>`<div class="slot"><span>${esc(p.name)}</span><em>${p.skill??"?"}</em></div>`).join("")}</div>`;root.innerHTML=`<section class="glass"><p class="kicker">Line generator</p><h1>Build your lineup</h1><div class="field" style="margin-top:0"><label for="strategy">Strategy</label><select id="strategy" onchange="strategy=this.value"><option value="balanced">Balance all lines evenly</option><option value="strongest">Strongest line first</option><option value="top2">Balance the top two lines</option></select></div><div class="row" style="margin-top:14px"><button class="primary" onclick="build()">${lineup?"Generate again":"Generate lineup"}</button>${lineup?'<button onclick="saveGame()">Save game</button>':""}</div></section>`+(lineup?`<section class="glass"><h2>Forward lines</h2>${lineup.f.map((g,i)=>`<div class="line"><div class="head">Line ${i+1}<span>Skill ${tot(g)}</span></div>${slots(g)}</div>`).join("")}${lineup.r&&lineup.r.length?`<div class="line rot"><div class="head">Rotating<span>Swap in each shift for equal ice time</span></div>${slots(lineup.r,lineup.r.length===2?"two":"")}</div>`:""}</section><section class="glass"><h2>Defense pairs</h2>${lineup.d.map((g,i)=>`<div class="line"><div class="head">Pair ${i+1}<span>Skill ${tot(g)}</span></div>${slots(g,"two")}</div>`).join("")}</section>`:'<section class="glass empty muted">Pick a strategy and generate. Lines are always built in threes, with any extra forwards rotating.</section>');document.getElementById("strategy").value=strategy}
if(tab==="history"){root.innerHTML=`<section class="glass"><div class="row between"><h2>Game history</h2><button class="sm" onclick="saveGame()">Save lineup</button></div>${data.games.slice().reverse().map((g,i)=>`<div class="line"><div class="row between"><b>${esc(g.opponent)}</b><span class="small">${esc(g.date)}</span></div><p>${esc(g.result||"Result not entered")}</p><button class="sm" onclick="editGame(${data.games.length-1-i})">Edit result</button> <button class="sm danger" onclick="deleteGame(${data.games.length-1-i})">Delete</button></div>`).join("")||'<p class="muted">No games saved yet.</p>'}<div class="row" style="margin-top:14px"><button class="sm" onclick="exportBackup()">Export backup</button><button class="sm" onclick="document.getElementById('restore').click()">Import backup</button><input id="restore" class="hidden" type="file" accept="application/json" onchange="importBackup(event)"></div></section><section class="glass"><h2>Player chemistry</h2><p class="small">Add positive or negative connections to influence future line suggestions.</p><button class="add" style="margin-top:12px" onclick="addChem()">Add connection</button>${data.chem.map((c,i)=>`<div class="item"><span class="grow">${esc(name(c.a))} / ${esc(name(c.b))}</span><b class="gold">${c.v>0?"+":""}${c.v}</b><button class="icon" aria-label="Remove connection" onclick="delChem(${i})">×</button></div>`).join("")}</section>`}}
function attend(id,v){data.players.find(p=>p.id===id).attending=v;save();render()}function setAll(v){data.players.forEach(p=>p.attending=v);save();render()}function name(id){return data.players.find(p=>p.id===id)?.name||"?"}
const POS=["Forward","Center","RW/LW","RW","LW/RW","D","Goalie"];
function sheet(p,isNew){let opts=POS.includes(p.pos)?POS:[p.pos,...POS],m=document.createElement("div");m.className="sheet-bg";m.innerHTML=`<form class="sheet" role="dialog" aria-label="${isNew?"Add player":"Edit player"}"><div class="grab"></div><h2>${isNew?"Add player":"Edit "+esc(p.name)}</h2><div class="field"><label for="f-n">Nickname</label><input id="f-n" name="n" type="text" required autocomplete="off" value="${esc(p.name)}"></div><div class="row" style="gap:10px;flex-wrap:nowrap"><div class="field grow"><label for="f-p">Position</label><select id="f-p" name="p">${opts.map(o=>`<option${o===p.pos?" selected":""}>${esc(o)}</option>`).join("")}</select></div><div class="field" style="width:96px"><label for="f-s">Skill 1–10</label><input id="f-s" name="s" type="number" min="1" max="10" inputmode="numeric" placeholder="–" value="${p.skill??""}"></div></div><div class="field"><label for="f-a">Can also play</label><input id="f-a" name="a" type="text" autocomplete="off" placeholder="Optional" value="${esc(p.alt||"")}"></div><div class="actions">${isNew?"":'<button type="button" class="danger" data-x="del">Remove</button>'}<button type="button" data-x="no">Cancel</button><button type="submit" class="primary">${isNew?"Add player":"Save"}</button></div></form>`;let close=()=>m.remove();m.onclick=e=>{if(e.target===m||e.target.dataset.x==="no")close();if(e.target.dataset.x==="del"&&confirm(`Remove ${p.name} from the roster?`)){data.players=data.players.filter(x=>x.id!==p.id);data.chem=data.chem.filter(c=>c.a!==p.id&&c.b!==p.id);save();close();render()}};m.onkeydown=e=>{if(e.key==="Escape")close()};m.querySelector("form").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),sk=f.get("s");p.name=String(f.get("n")).trim()||p.name;p.skill=sk===""?null:Math.max(1,Math.min(10,Math.round(Number(sk))));p.pos=f.get("p");p.alt=String(f.get("a")).trim();if(isNew)data.players.push(p);save();close();render()};document.body.appendChild(m);if(isNew)m.querySelector("#f-n").focus()}
function editPlayer(id){sheet(data.players.find(x=>x.id===id),false)}
function addPlayer(){sheet({id:"p"+Date.now(),name:"",skill:null,pos:"Forward",alt:"",attending:true},true)}
function chem(a,b){let x=data.chem.find(c=>(c.a===a&&c.b===b)||(c.a===b&&c.b===a));return x?.v||0}
function build(){let ps=data.players.filter(p=>p.attending&&!goalie(p)),ds=ps.filter(isD),fs=ps.filter(p=>!isD(p));if(!fs.length||!ds.length){alert("Select at least one forward and one defenseman.");return}
let lines=Math.max(1,Math.floor(fs.length/3)),slots=Math.min(fs.length,lines*3),best=null,bestScore=Infinity;
for(let k=0;k<800;k++){let f=fs.slice().sort(()=>Math.random()-.5),d=ds.slice().sort(()=>Math.random()-.5),groups=Array.from({length:lines},()=>[]);f.slice(0,slots).forEach((p,i)=>groups[i%lines].push(p));let rot=f.slice(slots);if(strategy==="strongest"){groups.sort((a,b)=>b.reduce((s,p)=>s+rating(p),0)-a.reduce((s,p)=>s+rating(p),0));rot.sort((a,b)=>rating(b)-rating(a))}let totals=groups.map(g=>g.reduce((s,p)=>s+rating(p),0));let spread=Math.max(...totals)-Math.min(...totals);let ch=0;groups.forEach(g=>g.forEach((p,i)=>g.slice(i+1).forEach(q=>ch+=chem(p.id,q.id))));let rotAvg=rot.length?rot.reduce((s,p)=>s+rating(p),0)/rot.length:0;let score=strategy==="top2"&&groups.length>1?Math.abs(totals[0]-totals[1])*1.8+spread*.15-ch*.8:strategy==="strongest"?-(totals[0]||0)*.5+spread*.2-ch*.8:spread-ch*.8;if(score<bestScore){bestScore=score;best={f:groups,r:rot,d:Array.from({length:Math.ceil(d.length/2)},(_,i)=>d.slice(i*2,i*2+2))}}}
lineup=best;render()}
function saveGame(){if(!lineup){alert("Generate a lineup first.");return}let opponent=prompt("Opponent / game name","Friendly game");if(opponent===null)return;let result=prompt("Final score (optional)","")||"";data.games.push({opponent,result,date:new Date().toISOString().slice(0,10),lineup:JSON.parse(JSON.stringify(lineup))});save();alert("Game saved.");render()}
function editGame(i){let r=prompt("Update result",data.games[i].result||"");if(r!==null){data.games[i].result=r;save();render()}}function deleteGame(i){if(confirm("Delete this game?")){data.games.splice(i,1);save();render()}}
function addChem(){let a=prompt("First player nickname"),b=prompt("Second player nickname");if(!a||!b)return;let p=data.players.find(x=>x.name.toLowerCase()===a.toLowerCase()),q=data.players.find(x=>x.name.toLowerCase()===b.toLowerCase());if(!p||!q||p.id===q.id){alert("Enter two different roster names exactly.");return}let v=Number(prompt("Connection: -2, -1, 1 or 2","2"));if(![-2,-1,1,2].includes(v))return;data.chem=data.chem.filter(c=>!((c.a===p.id&&c.b===q.id)||(c.a===q.id&&c.b===p.id)));data.chem.push({a:p.id,b:q.id,v});save();render()}function delChem(i){data.chem.splice(i,1);save();render()}
function exportBackup(){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.href=u;a.download="hockey-freunde-manager-backup.json";a.click();URL.revokeObjectURL(u)}function importBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.players||!x.games)throw 0;data=x;save();render();alert("Backup restored.")}catch{alert("Invalid backup file.")}};r.readAsText(f)}
render();if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
