<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151d"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>Hockey Freunde Manager</title>
<style>
:root{--bg:#0a1019;--gold:#f5c928;--muted:#aab5c4;--line:#ffffff26}*{box-sizing:border-box}body{margin:0;color:#f7f8fb;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 15% 0%,#35445b,transparent 40%),linear-gradient(145deg,#0b111b,#151d2a 55%,#080d15);min-height:100vh}header{padding:calc(18px + env(safe-area-inset-top)) 18px 12px;max-width:900px;margin:auto;font-weight:900;letter-spacing:.14em}header span{display:block;color:var(--gold);font-size:11px}main{max-width:900px;margin:auto;padding:12px 14px 100px}.glass{background:linear-gradient(135deg,#ffffff20,#ffffff08);border:1px solid var(--line);box-shadow:inset 0 1px 0 #ffffff25,0 18px 45px #0005;backdrop-filter:blur(24px);border-radius:22px;padding:18px;margin-bottom:13px}h1{font-size:27px;margin:3px 0 8px}h2{font-size:18px;margin:0 0 13px}.muted,.small{color:var(--muted)}.small{font-size:12px}.gold{color:var(--gold);font-weight:800}button,select,input{font:inherit;color:inherit;border:1px solid var(--line);background:#ffffff12;border-radius:12px;padding:10px}button{cursor:pointer;font-weight:650}button.primary{background:linear-gradient(135deg,#ffe47a,#e6b900);color:#171717;border:0}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}.stat{font-size:25px;color:var(--gold);font-weight:800}.player{display:flex;gap:9px;align-items:center;padding:9px 0;border-bottom:1px solid #ffffff15}.grow{flex:1}.chip{display:inline-block;padding:8px 10px;background:#ffffff12;border-radius:11px;margin:3px}.line{padding:12px;background:#ffffff0b;border:1px solid #ffffff19;border-radius:16px;margin:9px 0}label{display:block;color:var(--muted);font-size:12px;margin:10px 0 5px}input[type=text],input[type=number],select{width:100%}nav{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:10px;right:10px;max-width:650px;margin:auto;z-index:3;display:flex;justify-content:space-around;padding:8px;border-radius:22px;background:#18202ccc;border:1px solid #ffffff30;backdrop-filter:blur(25px)}nav button{border:0;background:none;font-size:11px;color:#abb6c7;padding:7px}nav button.active{color:var(--gold)}.hidden{display:none!important}.notice{color:#f5dfa0;font-size:12px}
</style></head><body><header>HOCKEY FREUNDE<span>MANAGER · EFM TEAM TOOL</span></header><main id="app"></main><nav><button data-tab="home">⌂ Home</button><button data-tab="players">♙ Players</button><button data-tab="builder">⌗ Lines</button><button data-tab="history">◷ History</button></nav>
<script>
const roster=[
["Aaron",9,"D","RW/LW"],["Andre",4,"D","RW/LW"],["Denis",4,"RW/LW",""],["Flo B",7,"RW/LW",""],["Jonas",7,"RW/LW","Center"],["Dominik",7,"LW/RW","D"],["Raphi",7,"RW","Center"],["Flo F",6,"RW/LW","Center"],["Karl",6,"D","D"],["Hias",null,"D",""],["Johannes",7,"Center","RW/LW"],["Maxi",7,"RW/LW","RW/LW"],["Bene",null,"Goalie","Goalie"],["Martina",null,"Goalie","Goalie"],["Carlo",7,"Forward","D"],["Lucas",6,"D","RW/LW"],["Leo",9,"Forward","Center/Defense"],["Mario",6,"RW/LW","Center"],["Michi P",6,"Forward",""],["Florens",7,"D",""],["Luca",9,"D","Forward"],["Guggi",5,"D","RW/LW"],["Morty",3,"Forward",""],["Tim",null,"D","RW/LW"],["Max",7,"D","RW/LW"],["Volker",8,"D","Center"],["Luis",4,"Center","RW/LW"],["Michi W",10,"Forward","RW/LW"],["Oli",8,"Center","RW/LW"],["Femke",4,"Forward",""],["Mischa",null,"Forward",""],["Gilbert",9,"Forward",""]
].map((x,i)=>({id:"p"+i,name:x[0],skill:x[1],pos:x[2],alt:x[3],attending:true}));
const KEY="hfm-v1";let data;try{data=JSON.parse(localStorage.getItem(KEY))||{players:roster,chem:[],games:[]}}catch{data={players:roster,chem:[],games:[]}}let tab="home",lineup=null,strategy="balanced";
const save=()=>localStorage.setItem(KEY,JSON.stringify(data)),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])),rating=p=>p.skill||5,goalie=p=>p.pos==="Goalie",isD=p=>p.pos==="D";
function nav(t){tab=t;render()}document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>nav(b.dataset.tab));
function render(){document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===tab));let root=document.getElementById("app");
if(tab==="home"){let sk=data.players.filter(p=>p.attending&&!goalie(p)).length;root.innerHTML=`<section class="glass"><div class="small">YOUR TEAM · GAME DAY</div><h1>Hockey Freunde<br>Manager</h1><p class="muted">Build your lines. Find your chemistry. Play together.</p><div class="grid"><div><div class="stat">${data.players.length}</div><div class="small">Roster players</div></div><div><div class="stat">${sk}</div><div class="small">Selected skaters</div></div><div><div class="stat">${data.games.length}</div><div class="small">Games saved</div></div></div></section><section class="glass"><h2>Game day setup</h2><p class="muted">Choose who's attending, then generate flexible forward lines and defense pairings.</p><div class="row"><button class="primary" onclick="nav('players')">Select attendance</button><button onclick="nav('builder')">Build lineup →</button></div></section><section class="glass"><h2>Recent games</h2>${data.games.slice(-3).reverse().map(g=>`<div class="player"><b class="grow">${esc(g.opponent)}</b><span>${esc(g.result||"—")}</span></div>`).join("")||'<p class="muted">Saved games will appear here.</p>'}</section>`}
if(tab==="players"){root.innerHTML=`<section class="glass"><div class="row between"><h2>Player roster</h2><button onclick="addPlayer()">＋ Add player</button></div><div class="row"><button onclick="setAll(true)">Select all</button><button onclick="setAll(false)">Clear attendance</button></div>${data.players.map(p=>`<div class="player"><input type="checkbox" ${p.attending?"checked":""} onchange="attend('${p.id}',this.checked)"><div class="grow"><b>${esc(p.name)}</b><div class="small">${esc(p.pos)} · ${esc(p.alt||"No alternative")}</div></div><span class="gold">${p.skill??"—"}</span><button onclick="editPlayer('${p.id}')">Edit</button></div>`).join("")}</section>`}
if(tab==="builder"){root.innerHTML=`<section class="glass"><div class="small">LINE GENERATOR</div><h1>Build your lineup</h1><label>Strategy</label><select id="strategy" onchange="strategy=this.value"><option value="balanced">Balanced scores across lines</option><option value="strongest">Strongest lines first</option><option value="top2">Balance top two lines</option></select><div class="row" style="margin-top:12px"><button class="primary" onclick="build()">✦ Generate lineup</button><button onclick="saveGame()">Save game</button></div></section>${lineup?'<section class="glass"><h2>Forward lines</h2>'+lineup.f.map((g,i)=>'<div class="line"><b>Line '+(i+1)+'</b><div>'+g.map(p=>'<span class="chip">'+esc(p.name)+' · '+(p.skill??'?')+'</span>').join('')+'</div></div>').join('')+(lineup.r&&lineup.r.length?'<div class="line"><b>Rotating forward'+(lineup.r.length>1?'s':'')+'</b><div class="small">Swap into the lines in turn so everyone gets equal ice time</div><div>'+lineup.r.map(p=>'<span class="chip">'+esc(p.name)+' · '+(p.skill??'?')+'</span>').join('')+'</div></div>':'')+'<h2>Defense pairings</h2>'+lineup.d.map((g,i)=>'<div class="line"><b>Pair '+(i+1)+'</b><div>'+g.map(p=>'<span class="chip">'+esc(p.name)+'</span>').join('')+'</div></div>').join('')+'</section>':'<section class="glass muted">No lineup yet. Generate one to get started.</section>'}`}
if(tab==="history"){root.innerHTML=`<section class="glass"><div class="row between"><h2>Game history</h2><button onclick="saveGame()">＋ Save lineup</button></div>${data.games.slice().reverse().map((g,i)=>`<div class="line"><div class="row between"><b>${esc(g.opponent)}</b><span class="small">${esc(g.date)}</span></div><p>${esc(g.result||"Result not entered")}</p><button onclick="editGame(${data.games.length-1-i})">Edit result</button> <button onclick="deleteGame(${data.games.length-1-i})">Delete</button></div>`).join("")||'<p class="muted">No games saved yet.</p>'}<div class="row"><button onclick="exportBackup()">Export backup</button><button onclick="document.getElementById('restore').click()">Import backup</button><input id="restore" class="hidden" type="file" accept="application/json" onchange="importBackup(event)"></div></section><section class="glass"><h2>Player chemistry</h2><p class="small">Add positive or negative connections to influence future line suggestions.</p><button onclick="addChem()">＋ Add connection</button>${data.chem.map((c,i)=>`<div class="player"><span class="grow">${esc(name(c.a))} / ${esc(name(c.b))}</span><b class="gold">${c.v>0?"+":""}${c.v}</b><button onclick="delChem(${i})">×</button></div>`).join("")}</section>`}}
function attend(id,v){data.players.find(p=>p.id===id).attending=v;save()}function setAll(v){data.players.forEach(p=>p.attending=v);save();render()}function name(id){return data.players.find(p=>p.id===id)?.name||"?"}
function editPlayer(id){let p=data.players.find(x=>x.id===id);let n=prompt("Player nickname",p.name);if(n===null)return;let s=prompt("Skill 1–10 (blank if unknown)",p.skill??"");if(s===null)return;let pos=prompt("Favourite position (D, Forward, Center, RW/LW, Goalie)",p.pos);if(pos===null)return;let alt=prompt("Alternative position",p.alt);if(alt===null)return;p.name=n.trim()||p.name;p.skill=s===""?null:Math.max(1,Math.min(10,Number(s)));p.pos=pos;p.alt=alt;save();render()}
function addPlayer(){let n=prompt("Player nickname");if(!n)return;let pos=prompt("Favourite position","Forward")||"Forward";data.players.push({id:"p"+Date.now(),name:n,skill:null,pos,alt:"",attending:true});save();render()}
function chem(a,b){let x=data.chem.find(c=>(c.a===a&&c.b===b)||(c.a===b&&c.b===a));return x?.v||0}
function build(){let ps=data.players.filter(p=>p.attending&&!goalie(p)),ds=ps.filter(isD),fs=ps.filter(p=>!isD(p));if(!fs.length||!ds.length){alert("Select at least one forward and one defenseman.");return}
let lines=Math.max(1,Math.floor(fs.length/3)),slots=Math.min(fs.length,lines*3),best=null,bestScore=Infinity;
for(let k=0;k<800;k++){let f=fs.slice().sort(()=>Math.random()-.5),d=ds.slice().sort(()=>Math.random()-.5),groups=Array.from({length:lines},()=>[]);f.slice(0,slots).forEach((p,i)=>groups[i%lines].push(p));let rot=f.slice(slots);if(strategy==="strongest"){groups.sort((a,b)=>b.reduce((s,p)=>s+rating(p),0)-a.reduce((s,p)=>s+rating(p),0));rot.sort((a,b)=>rating(b)-rating(a))}let totals=groups.map(g=>g.reduce((s,p)=>s+rating(p),0));let spread=Math.max(...totals)-Math.min(...totals);let ch=0;groups.forEach(g=>g.forEach((p,i)=>g.slice(i+1).forEach(q=>ch+=chem(p.id,q.id))));let rotAvg=rot.length?rot.reduce((s,p)=>s+rating(p),0)/rot.length:0;let score=strategy==="top2"&&groups.length>1?Math.abs(totals[0]-totals[1])*1.8+spread*.15-ch*.8:strategy==="strongest"?-(totals[0]||0)*.5+spread*.2-ch*.8:spread-ch*.8;if(score<bestScore){bestScore=score;best={f:groups,r:rot,d:Array.from({length:Math.ceil(d.length/2)},(_,i)=>d.slice(i*2,i*2+2))}}}
lineup=best;render()}
function saveGame(){if(!lineup){alert("Generate a lineup first.");return}let opponent=prompt("Opponent / game name","Friendly game");if(opponent===null)return;let result=prompt("Final score (optional)","")||"";data.games.push({opponent,result,date:new Date().toISOString().slice(0,10),lineup:JSON.parse(JSON.stringify(lineup))});save();alert("Game saved.");render()}
function editGame(i){let r=prompt("Update result",data.games[i].result||"");if(r!==null){data.games[i].result=r;save();render()}}function deleteGame(i){if(confirm("Delete this game?")){data.games.splice(i,1);save();render()}}
function addChem(){let a=prompt("First player nickname"),b=prompt("Second player nickname");if(!a||!b)return;let p=data.players.find(x=>x.name.toLowerCase()===a.toLowerCase()),q=data.players.find(x=>x.name.toLowerCase()===b.toLowerCase());if(!p||!q||p.id===q.id){alert("Enter two different roster names exactly.");return}let v=Number(prompt("Connection: -2, -1, 1 or 2","2"));if(![-2,-1,1,2].includes(v))return;data.chem=data.chem.filter(c=>!((c.a===p.id&&c.b===q.id)||(c.a===q.id&&c.b===p.id)));data.chem.push({a:p.id,b:q.id,v});save();render()}function delChem(i){data.chem.splice(i,1);save();render()}
function exportBackup(){let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));a.href=u;a.download="hockey-freunde-manager-backup.json";a.click();URL.revokeObjectURL(u)}function importBackup(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x.players||!x.games)throw 0;data=x;save();render();alert("Backup restored.")}catch{alert("Invalid backup file.")}};r.readAsText(f)}
render();if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script></body></html>
